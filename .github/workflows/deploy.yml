# Workflow for deploying Next.js site to GitHub Pages
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test

  e2e-tests:
    runs-on: ubuntu-latest
    # Runs inside Playwright's official image (Chromium + all OS deps preinstalled) instead of
    # installing them live via apt-get on the bare runner — that live apt/mirror dependency is
    # what caused this job to hang indefinitely twice in a row (2026-08-19), confirmed via the
    # raw job log showing apt-get going silent mid-fetch with no error, no output, no recovery.
    # Tag must match the "@playwright/test" version pinned in frontend/package.json, or Playwright
    # refuses to run (version mismatch check) — bumping one requires bumping the other.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # --ipc=host: without it Chromium can exhaust shared memory and crash mid-test (Docker's
      # default /dev/shm is only 64MB) — official Playwright Docker guidance for CI.
      # --init: the container's PID 1 is the test process, not a real init system; --init adds
      # one so zombie child processes (e.g. from a killed browser) get reaped correctly.
      options: --ipc=host --init
    timeout-minutes: 15
    needs: [backend-tests, frontend-checks]
    env:
      # Shared by alembic/seed (backend/) and `npx playwright test` (frontend/, whose webServer
      # spawns uvicorn as a child process that inherits this) — all three must point at the same
      # fresh, migrated DB file. Unset in every other job/environment, so nothing else is affected.
      DATABASE_URL: sqlite:///./e2e_tivuta.db
      # security.py's fail-fast guard requires this whenever DATABASE_URL is set (its own
      # "is this a real deployment" signal) — any value works, this DB isn't real production data.
      JWT_SECRET_KEY: e2e-ci-secret-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install
      - name: Migrate E2E database
        working-directory: ./backend
        run: alembic upgrade head
      - name: Seed E2E database
        working-directory: ./backend
        run: python -m scripts.seed_e2e
      - name: Run E2E tests
        working-directory: ./frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-tests, frontend-checks, e2e-tests]
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next
      - name: Install dependencies
        run: npm install
      - name: Static HTML export with Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
