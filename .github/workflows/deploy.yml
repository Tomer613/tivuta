# Workflow for deploying Next.js site to GitHub Pages
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-tests, frontend-checks]
    env:
      # Shared by alembic/seed (backend/) and `npx playwright test` (frontend/, whose webServer
      # spawns uvicorn as a child process that inherits this) — all three must point at the same
      # fresh, migrated DB file. Unset in every other job/environment, so nothing else is affected.
      DATABASE_URL: sqlite:///./e2e_tivuta.db
      # security.py's fail-fast guard requires this whenever DATABASE_URL is set (its own
      # "is this a real deployment" signal) — any value works, this DB isn't real production data.
      JWT_SECRET_KEY: e2e-ci-secret-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install
      - name: Get installed Playwright version
        working-directory: ./frontend
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      # Both install commands below hit the exact same live apt-get/mirror dependency that hung
      # this job indefinitely, twice, on 2026-08-19 (confirmed via the raw job log: apt-get went
      # silent mid-fetch with zero output or error for 42+ minutes). A Docker-container alternative
      # was tried and reverted the same day after four separate, increasingly fundamental
      # incompatibilities between actions/setup-python's portable Python build and Playwright's
      # container image (apt hang → missing lsb_release → broken pip cache → pip itself missing
      # entirely) — not worth the ongoing compatibility tax versus this simpler, well-trodden path.
      # nick-fields/retry bounds each attempt to 3 minutes and retries up to 3 times, so a repeat
      # of the same mirror hang self-recovers within ~9 minutes instead of silently consuming the
      # whole job (or blocking every subsequent deploy behind it, since `deploy.yml`'s
      # `cancel-in-progress: false` queues rather than preempts).
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 3
          command: cd frontend && npx playwright install --with-deps chromium
      - name: Install Playwright OS dependencies only (browsers cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 3
          command: cd frontend && npx playwright install-deps chromium
      - name: Migrate E2E database
        working-directory: ./backend
        run: alembic upgrade head
      - name: Seed E2E database
        working-directory: ./backend
        run: python -m scripts.seed_e2e
      - name: Run E2E tests
        working-directory: ./frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-tests, frontend-checks, e2e-tests]
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next
      - name: Install dependencies
        run: npm install
      - name: Static HTML export with Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
