name: Keep Backend Warm

# Render's free tier spins the backend down after ~15 minutes of inactivity,
# causing the next real visitor to wait ~50s for a cold start. Pinging on a
# tighter interval than that timeout keeps it warm for active periods.
# GitHub's cron scheduler can itself run a few minutes late, so this alone
# won't eliminate cold starts entirely (e.g. overnight), but it removes them
# during normal usage hours.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend root endpoint
        run: |
          curl -s -o /dev/null -w "status: %{http_code}, time: %{time_total}s\n" https://tivuta.onrender.com/
