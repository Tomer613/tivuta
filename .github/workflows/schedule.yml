name: Trigger Scheduled Distributions

on:
  schedule:
    # Runs every 15 minutes to check for scheduled tasks
    - cron: '*/15 * * * *'

jobs:
  trigger_api:
    runs-on: ubuntu-latest
    steps:
      - name: Call FastAPI backend to process scheduled tasks
        run: |
          curl -s -X POST "https://tivuta.onrender.com/api/distributions/process-scheduled" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Fail out any distribution stuck at "sending" past the configured timeout
        run: |
          curl -s -X POST "https://tivuta.onrender.com/api/distributions/timeout-stuck-sends" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Send confirmation reminders for orders nearing their 24h deadline
        run: |
          curl -s -X POST "https://tivuta.onrender.com/api/orders/send-confirmation-reminders" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Auto-cancel and restock orders whose confirmation deadline has passed
        run: |
          curl -s -X POST "https://tivuta.onrender.com/api/orders/auto-cancel-expired" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"